name: 💾 XHAccess Downloader

on:
  workflow_dispatch:
    inputs:
      urls:
        description: '🔗 لینک ویدیوهای xhaccess.com (با فاصله جدا کنید)'
        required: true
        type: string
      quality:
        description: '🎬 کیفیت ویدیو'
        required: false
        default: '720'
        type: choice
        options:
          - 720
          - 1080
          - best

jobs:
  download-xhaccess:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global http.postBuffer 524288000
          git config --global core.compression 0
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip p7zip-full curl jq bc
          pip3 install --upgrade yt-dlp

      - name: Download Videos from XHAccess
        run: |
          URLS_RAW="${{ github.event.inputs.urls }}"
          read -ra URL_LIST <<< "$URLS_RAW"
          QUALITY="${{ github.event.inputs.quality }}"

          mkdir -p videos
          BACKUP_DIR="/tmp/xh_downloads"
          mkdir -p "$BACKUP_DIR"

          echo "📥 تعداد لینک: ${#URL_LIST[@]}"

          for URL in "${URL_LIST[@]}"; do
            echo "========================================"
            echo "🔽 شروع دانلود: $URL"
            echo "========================================"

            TMP_DIR="tmp_download_$(date +%s)"
            mkdir -p "$TMP_DIR"

            # انتخاب فرمت بر اساس کیفیت
            if [ "$QUALITY" = "720" ]; then
              FORMAT="bestvideo[height<=720]+bestaudio/bestvideo[height<=720]+bestaudio/best"
            elif [ "$QUALITY" = "1080" ]; then
              FORMAT="bestvideo[height<=1080]+bestaudio/bestvideo[height<=1080]+bestaudio/best"
            else
              FORMAT="0/best"
            fi

            yt-dlp \
              -o "$TMP_DIR/%(title)s.%(ext)s" \
              --no-playlist \
              --no-warnings \
              --format "$FORMAT" \
              --format-sort "res:720,codec:h264:vp9,filesize" \
              --prefer-free-formats \
              --merge-output-format mp4 \
              --retries 20 \
              --fragment-retries 15 \
              --concurrent-fragments 4 \
              --http-chunk-size 10M \
              --no-check-certificate \
              --referer "https://xhaccess.com/" \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36" \
              --restrict-filenames \
              "$URL"

            if [ $? -eq 0 ]; then
              echo "✅ دانلود موفق"

              for file in "$TMP_DIR"/*; do
                if [ -f "$file" ]; then
                  BASENAME=$(basename "$file")
                  NAME_NO_EXT="${BASENAME%.*}"
                  SAFE_NAME=$(echo "$NAME_NO_EXT" | sed 's/[^a-zA-Z0-9_.-]/-/g' | sed 's/-+/-/g' | sed 's/^-\+//g')
                  
                  mkdir -p "$BACKUP_DIR/${SAFE_NAME}"
                  cp "$file" "$BACKUP_DIR/${SAFE_NAME}/${SAFE_NAME}.mp4"
                  echo "   📁 ذخیره شد → ${SAFE_NAME}.mp4"
                fi
              done
            else
              echo "❌ دانلود ناموفق برای این لینک"
            fi

            rm -rf "$TMP_DIR"
            sleep 7
          done

          echo "🎉 تمام دانلودها تمام شد."

